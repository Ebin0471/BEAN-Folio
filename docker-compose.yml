# BEAN Folio — self-hosted production stack (M22 Phase 2, O3).
#
# NOT ACTIVATED anywhere by this change: this file is the reviewed, ready-to-run
# definition for a Tier A/B single-host deployment (docs/ops/DEPLOYMENT_TIERS.md).
# Bring it up deliberately, with secrets you create yourself:
#
#   cp .env.compose.example .env.compose   # create secrets OUTSIDE git
#   docker compose --env-file .env.compose up -d --build
#
# Topology: Caddy (automatic HTTPS via ACME) → app (standalone Next, this
# repo's Dockerfile) → PostgreSQL 16. Media defaults to a local volume; swap
# the app's MEDIA_* vars for the S3_* set on multi-host deployments.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: beanfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.compose}
      POSTGRES_DB: beanfolio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beanfolio -d beanfolio"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Resource ceilings: one noisy service must not starve its neighbours on a
    # shared host (Docker Compose v2 honors these on `docker compose up`).
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set in .env.compose}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://beanfolio:${POSTGRES_PASSWORD}@db:5432/beanfolio?connection_limit=10&pool_timeout=10
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      QUEUE_ENABLED: "true"
      RATE_LIMIT_BACKEND: postgres
      CACHE_BACKEND: postgres
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL:-}
      # Media on the local volume (single-host tier). For S3-compatible object
      # storage set ALL FOUR instead: S3_ENDPOINT, S3_BUCKET,
      # S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY (+ optional S3_REGION,
      # S3_FORCE_PATH_STYLE, MEDIA_STORAGE_DRIVER=s3).
      MEDIA_STORAGE_DRIVER: local
      MEDIA_LOCAL_ROOT: /data
      # CODE GIFTZ editing workspaces + LAXII temp frames live under /app/data
      # (both default to <cwd>/data/*). Mounting it as a volume keeps in-flight
      # workspaces alive across container restarts — without it, every restart
      # permanently breaks repositories mid-edit (workspaces are referenced by
      # absolute path and are NOT reconstructable from the DB).
      CODE_GIFTZ_WORKSPACE_ROOT: /app/data/giftz-workspaces
    volumes:
      - media:/data/uploads
      - app_data:/app/data
    expose:
      - "3000"
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      BEAN_DOMAIN: ${BEAN_DOMAIN:?set in .env.compose}
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  media:
  app_data:
  caddy_data:
  caddy_config:
