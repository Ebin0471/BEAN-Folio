name: CI

# BEAN FOLIO — continuous integration (M0.5 Stage C).
#
# Four independent jobs on every push to main and every pull request:
#   quality  — TypeScript, ESLint, Prisma schema validation (both schemas),
#              schema parity, tracked-tree runtime-data guard
#   tests    — the full suite against an ISOLATED sqlite database (never the
#              developer database), seeded with the product's own idempotent
#              fixture seeders; per-file execution (see scripts/ci/run-tests.sh
#              for the measured cross-file-interference rationale)
#   build    — production build (next build, standalone output)
#   security — gitleaks secret scan + runtime-data history guard
#
# Least privilege: read-only token, no secrets exposed to PR code, no
# workflow artifacts upload runtime data (nothing is uploaded at all).
# Action versions are tag-pinned; SHA-pinning is the documented hardening
# follow-up (docs/ops/CI.md).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript · Lint · Prisma · Runtime-data guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (.bun-version)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: TypeScript validation
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Prisma schema validation (sqlite)
        run: bunx prisma validate --schema prisma/schema.prisma

      - name: Prisma schema validation (postgres mirror)
        run: bunx prisma validate --schema prisma/schema.postgres.prisma

      - name: Prisma schema parity
        run: bun scripts/check-schema-parity.ts

      - name: Runtime-data guard (tracked tree)
        run: scripts/ci/guard-runtime-data.sh

  tests:
    name: Test suite (isolated database)
    runs-on: ubuntu-latest
    env:
      # Isolated, disposable test database — a fresh file per CI run, never
      # a developer's live database. The file name satisfies the suite's
      # sqlite/custom.db configuration guard (tests/auth.test.ts).
      DATABASE_URL: file:/home/runner/work/bean-ci-db/custom.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (.bun-version)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Materialize isolated test database schema
        run: |
          mkdir -p "$(dirname "${DATABASE_URL#file:}")"
          bunx prisma db push --skip-generate

      - name: Seed profession taxonomy (idempotent, upsert-only product data)
        run: bun scripts/seed-professions.ts

      - name: Seed demo fixtures (guarded — refuses production contexts)
        run: bun scripts/seed.ts

      - name: Restore QA fixture accounts (guarded, clearly identified)
        run: bun scripts/restore-qa-fixtures.ts

      - name: Run test suite (per file, isolated processes)
        run: scripts/ci/run-tests.sh

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (.bun-version)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Build (next build, standalone output)
        run: bun run build

  security:
    name: Secret scan · Runtime-data history guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — gitleaks needs it)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Runtime-data guard (recent history)
        run: scripts/ci/guard-runtime-data.sh --history 50
