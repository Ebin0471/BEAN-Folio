# BEAN Folio — MULTI-INSTANCE OVERLAY (MI-1 verification topology).
#
# This overlay is applied ON TOP of docker-compose.yml to run the Tier B
# multi-instance topology that milestone MI-1 makes SAFE:
#
#   docker compose --env-file .env.compose -f docker-compose.yml \
#     -f docker-compose.multi.yml up -d --build
#
# What it changes:
#   - app runs as 3 REPLACES-nothing replicas (`deploy.replicas`); all share
#     the same Postgres database, the same media volume and the same
#     /app/data volume. With the MI-1 state fixes, every instance reads the
#     same durable job/task/message state, the claim leases and guarded
#     transitions arbitrate execution, and the cancellation flag is honored
#     across instances.
#   - proxy (Caddy) already resolves `app` through Docker's embedded DNS, so
#     it load-balances across ALL replica containers automatically (round
#     robin on the A records). SSE (/api/ai/chat-stream) is plain HTTP —
#     no sticky sessions required.
#   - The queue worker runs INSIDE every app instance (instrumentation);
#     claims are status-guarded, so N workers never double-execute a job.
#
# KNOWN SINGLE-WRITER EXCEPTION (documented, not hidden): CODE GIFTZ editing
# workspaces live on the /app/data volume. A task's runner writes files on
# the instance that executes it; with replicas>1 a task executed by replica
# B must be approved/reverted through the SAME replica unless the workspace
# root is moved to a shared object store (SCALING_ARCHITECTURE.md §2, last
# row). Until then, keep GIFTZ workspace traffic on one replica (LB cookie
# on the /api/giftz/* paths) or run the single-app compose.
#
# Activation remains EXPLICIT and owner-gated (MILESTONE_EXECUTION_PROTOCOL
# §3.5): this file is shipped reviewed, not running.

services:
  app:
    deploy:
      replicas: 3
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    # Each replica gets the SAME resource ceiling as the single-instance
    # compose — the host must be sized for replicas × ceiling.
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Verifies the MI-1 state model is active (durable backends) — the same
    # env block as the base compose; repeated here for clarity of the
    # multi-instance contract.
    environment:
      RATE_LIMIT_BACKEND: postgres
      CACHE_BACKEND: postgres

  proxy:
    depends_on:
      - app
    # Caddy upstream stays `app:3000` (see Caddyfile.production): Docker DNS
    # returns every healthy replica container and Caddy balances across them.
