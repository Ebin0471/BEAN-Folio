<!DOCTYPE html>
<!-- Representative GIFTZ-generated page for the round-trip PoC — mirrors the
     real generated shape: viewport/lang meta, one linked stylesheet, a vendor
     script + the motion runtime script (with prefers-reduced-motion guard),
     nav links, sections with ids, an image with alt. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aurora Atelier — Portfolio</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <nav aria-label="Main">
      <a href="./index.html" class="nav-link">Home</a>
      <a href="./work.html" class="nav-link">Work</a>
      <a href="./contact.html" class="nav-link">Contact</a>
    </nav>
  </header>
  <main>
    <section class="hero" id="hero">
      <h1>Aurora Atelier</h1>
      <p class="hero-sub">Light-driven visual design for ambitious brands.</p>
      <a class="cta" href="./contact.html">Start a project</a>
    </section>
    <section class="work" id="work">
      <h2>Selected work</h2>
      <div class="grid">
        <article class="card"><img src="assets/img/project-1.svg" alt="Project one cover"><h3>Kite</h3></article>
        <article class="card"><img src="assets/img/project-2.svg" alt="Project two cover"><h3>Compass</h3></article>
      </div>
    </section>
  </main>
  <footer class="site-footer"><p>© Aurora Atelier</p></footer>
  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      if (window.gsap) window.gsap.to(".hero", { opacity: 1, duration: 0.8 });
    })();
  </script>
</body>
</html>
